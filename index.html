<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Sketch</title>
</head>
<body>
    <main>
        <div id="top-btn-container">
            <form id="gridSizeForm">
                <input type="number" placeholder="Grid Size: " id="gridInput">
                <input type="submit" value="Submit">
            </form>
            <div>
                <button id="toggleGridBtn">Toggle Grid</button>
                <button id="resetCanvasBtn">Reset Canvas</button>
            </div>
        </div>
        <div id="grid-container">
            <div id="row-container">

            </div>
        </div>
        <div id="bottom-btn-container">
            <label><input type="checkbox" id="clickMode">Click Mode</label>
            <label><input type="checkbox" id="rainbowMode">Rainbow Mode</label>
        </div>
    </main>
    <footer>
        <p>Created by&nbsp</p> <!-- Added a non-breaking space character -->
        <a href="https://github.com/DylanM3" target="_blank" rel="noopener noreferrer">Dylan Moore</a>
    </footer>
</body>
</html>
